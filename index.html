<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="home-team">
                <h3>HOME</h3>
                <div id="home-score">0</div>
                <div class="buttons">
                    <button id="home-1" onclick="addOnehome()">+1</button>
                    <button id="home-2" onclick="addTwohome()">+2</button>
                    <button id="home-3" onclick="addThreehome()">+3</button>
                </div>
            </div>
            
            <div class="away-team">
                <h3>GUEST</h3>
                <div id="away-score">0</div>
                <div class="buttons">
                    <button id="away-1" onclick="addOneaway()">+1</button>
                    <button id="away-2" onclick="addTwoaway()">+2</button>
                    <button id="away-3" onclick="addThreeaway()">+3</button>
                </div>
                
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
